---
name: PR Check
on:
  pull_request:
    types: ['opened', 'reopened', 'synchronize']
  merge_group:
  workflow_dispatch:

jobs:
  check:
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: checking for fork
        shell: pwsh
        run: |
          $isFork = "${{ github.event.pull_request.head.repo.fork }}"
          if($isFork -eq "true") {
            echo "### WARNING: This workflow is disabled for forked repositories. Please follow the [release branch process](https://azure.github.io/Azure-Verified-Modules/contributing/terraform/terraform-contribution-flow/#5-create-a-pull-request-to-the-upstream-repository) if end to end tests are required." >> $env:GITHUB_STEP_SUMMARY
          }

  run-managed-workflow:
    if: github.event.pull_request.head.repo.fork == false
    uses: Azure/azure-verified-modules-tools/.github/workflows/terraform-module.yml@main
    name: run managed workflow
    secrets: inherit
    permissions:
      id-token: write
      contents: read
    with:
      # Pinned for the duration of the azurerm -> azapi migration. The reusable workflow installs
      # the latest Avm.Authoring when this is unset, and 0.10.1 introduced rules that the module
      # cannot satisfy until the migration completes - most notably provider_azurerm_disallowed,
      # which fires on every resource the migration has not reached yet. Remove this pin once the
      # migration removes the azurerm provider.
      avm-authoring-version: '0.9.5'
